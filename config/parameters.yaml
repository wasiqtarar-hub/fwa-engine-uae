# =============================================================================
# PARAMETER REGISTRY  —  parameter governance
# =============================================================================
# "Every threshold, peer-grouping parameter and configuration value used
#  anywhere in this system must live in an effective-dated table scoped by
#  regulator, payer, product, contract, provider type and code family, and every
#  such value must record its owner, rationale, source, approval, expected alert
#  volume and expiry/review date."
#
# Consequences that are enforced in code, not merely stated here:
#   * `fwa.config.ParameterRegistry` is the ONLY way any module reads a
#     threshold. A test (tests/governance/test_no_hardcoded_thresholds.py)
#     scans src/ for magic numeric comparisons outside this registry.
#   * Every lookup is an AS-OF lookup against the claim's service date,
#     never against today's date.
#   * Every value below is a CONFIGURATION PLACEHOLDER for a design
#     artefact. None of them is a universal medical, actuarial or regulatory
#     fact, and the design is explicit on this point. `source` says where
#     each came from; where the honest answer is "chosen for this artefact",
#     it says exactly that.
#
# `expected_alert_volume` is the volume the owner expects on a 5,000-claim
# file. It is a governance commitment, not a measured result; the validation
# run reports OBSERVED volume beside it so divergence is visible.
# =============================================================================

defaults:
  regulator: "NOT_APPLICABLE" # not DoH, not DHA: no regulator endorses these values
  payer: "*"
  product: "*"
  contract: "*"
  provider_type: "*"
  code_family: "*"
  valid_from: "1900-01-01"
  valid_to: "2099-12-31"

parameters:

  # ---------------------------------------------------------------------------
  # Platform / operating parameters
  # ---------------------------------------------------------------------------
  - key: session_timeout_minutes
    value: 30
    owner: administrator
    rationale: "Idle session expiry for the reviewer UI."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: alerts_per_reviewer_per_day
    value: 25
    owner: claims_operations
    rationale: "Reviewer capacity used to calibrate model thresholds to capacity rather than to a fixed significance level. Drives precision@capacity."
    source: "Chosen for this artefact. A real deployment would measure this."
    approved_by: policy_owner
    expected_alert_volume: null
    review_date: "2027-01-01"

  - key: reviewer_count
    value: 4
    owner: claims_operations
    rationale: "Number of reviewers assumed for capacity computations. Exposed as a UI slider."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: fully_loaded_review_cost_per_case_aed
    value: 120.0
    owner: finance
    rationale: "Fully loaded reviewer cost per case, used for the 'net savings after review cost' metric. Without it, net savings cannot be computed and would be reported as NOT_MEASURABLE."
    source: "Chosen for this artefact; a real deployment would take this from payroll and overhead allocation."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: alert_volume_ceiling_per_rule_per_run
    value: 400
    owner: policy_owner
    rationale: "A runaway rule must not flood the queue (a platform requirement). A rule exceeding this ceiling is auto-routed to MONITOR_ONLY and raises a governance event."
    source: "Chosen for this artefact: 8% of a 5,000-claim run."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: random_audit_sample_size
    value: 400
    owner: siu
    rationale: "Stratified random-audit sample size. The random audit is the only mechanism capable of estimating a false-negative rate."
    source: "Chosen for this artefact; gives roughly ±4pp precision on a proportion at 95% confidence."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: random_seed
    value: 20260920
    owner: analytics
    rationale: "Fixed seed so that `python -m fwa.run_validation` is deterministic and every reported figure is reproducible (the Definition of Done)."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Peer grouping and statistical control
  # ---------------------------------------------------------------------------
  - key: min_peer_group_n
    value: 30
    owner: analytics
    rationale: "Minimum number of entities in a peer group before it may be used; below this the hierarchy backs off to the parent level and records peer_level_used."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: min_entity_opportunities
    value: 5
    owner: analytics
    rationale: "Minimum claim count for an entity before any peer-relative rate is computed at all. Below this the entity is reported as insufficient evidence, not as a low-rate entity."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: max_posterior_width
    value: 0.25
    owner: analytics
    rationale: "Entities whose empirical-Bayes posterior interval is wider than this are EXCLUDED FROM RANKING rather than flagged on a falsely precise point estimate (an explicit design requirement)."
    source: "The peer design requires the mechanism; the numeric width is chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: posterior_interval_mass
    value: 0.90
    owner: analytics
    rationale: "Credible-interval mass reported beside every shrunk rate."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: robust_residual_flag_threshold
    value: 3.5
    owner: analytics
    rationale: "Robust (median/MAD) residual above which a Type-S amount control raises a signal. MAD-based, never mean/SD — claims amounts are heavily right-skewed."
    source: "Chosen for this artefact; 3.5 is the conventional modified z-score outlier cut (Iglewicz & Hoaglin)."
    approved_by: policy_owner
    expected_alert_volume: 150
    review_date: "2027-01-01"

  - key: amount_per_los_day_peer_percentile
    value: 0.99
    owner: coding_policy
    rationale: >
      CLN-01-R02. the design permits "median/MAD OR PERCENTILE-BASED robust statistics", and amount
      per inpatient day is a RATIO of two skewed quantities, so its tail is far heavier than
      either. A modified-z cut of 3.5 on this metric flags 699 of 5,000 claims (14%), which
      breaches the alert-volume ceiling and would be an unusable queue — the number is
      describing the tail of a ratio distribution, not a population of suspect claims. The
      percentile form is used instead: it is inside that menu, it is interpretable to a
      reviewer ("in the top 1% of comparable claims per day"), and it is volume-controlled by
      construction. The modified-z residual is still computed and shown on the signal.
    source: "The design permits percentile-based robust statistics; the percentile is chosen for this artefact."
    approved_by: coding_policy
    expected_alert_volume: 60
    review_date: "2027-01-01"

  - key: early_tenure_amount_peer_percentile
    value: 0.75
    owner: underwriting
    rationale: >
      POL-01-R04. the control catalogue's trigger is a claim pattern that "exceeds tenure/risk-adjusted
      EXPECTATION", which is a comparison to the peer distribution rather than an extreme-tail
      cut. Only 29 claims in the claim extract fall inside the early-tenure window at all, so an
      extreme-tail threshold would reduce the control to noise. The 75th diagnosis-peer
      percentile means "above what three quarters of comparable claims cost", which is what
      "exceeds expectation" means in plain language.
    source: "the control catalogue wording; the percentile is chosen for this artefact."
    approved_by: underwriting
    expected_alert_volume: 11
    review_date: "2027-01-01"

  - key: referral_concentration_peer_residual_threshold
    value: 3.0
    owner: siu
    rationale: >
      NET-01-R01 and NET-04-R02. the control catalogue compares top-recipient share to PEERS, and on
      the claim extract the highest agent top-provider share is 0.037 because 20 agents spread across
      200 providers — so the absolute threshold below
      (cfg.referral_concentration_threshold) is never met and is reported as not met rather
      than quietly lowered. The peer-relative form is what actually executes: a robust
      (median/MAD) residual of the agent's top-recipient share against the other agents.
    source: "the control catalogue wording ('exceeds specialty/geographic peers'); the residual cut is chosen for this artefact."
    approved_by: siu
    expected_alert_volume: 3
    review_date: "2027-01-01"

  - key: min_history_periods
    value: 6
    owner: analytics
    rationale: "Minimum number of monthly periods of provider history before a CUSUM/EWMA change point may be DECLARED (explicit requirement)."
    source: "The change-detection design requires a configured minimum; the value is chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: cusum_k
    value: 0.5
    owner: analytics
    rationale: "CUSUM reference value (allowance), in standardised units — the shift size the chart is tuned to detect quickly (Page, 1954)."
    source: "Standard CUSUM parameterisation for a 1-sigma shift."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: cusum_h
    value: 3.0
    owner: analytics
    rationale: >
      CUSUM decision interval. Larger h means fewer false change points and slower detection.
      The conventional pairing with k=0.5 is h=4–5, which gives an in-control average run
      length of several hundred periods. Each provider in the claim extract has a MEDIAN OF 18
      MONTHLY PERIODS, so an ARL that long makes detection arithmetically impossible rather
      than merely conservative: at h=5.0 the detector declares 0 change points across all 200
      providers, which would be a property of the decision interval and not a finding about
      providers. h=3.0 is chosen so that the in-control ARL is commensurate with the series
      length actually available. This is a stated calibration to series length, NOT a
      threshold lowered until the control produced results — the observed volume at each
      candidate h is reported in validation_report.md so the choice is inspectable.
    source: "Page (1954) CUSUM, with the decision interval calibrated to the ~18-period series length in the claim extract."
    approved_by: policy_owner
    expected_alert_volume: 50
    review_date: "2027-01-01"

  - key: ewma_lambda
    value: 0.2
    owner: analytics
    rationale: "EWMA smoothing constant for monthly normalised provider metrics."
    source: "Standard EWMA parameterisation."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: ewma_L
    value: 3.0
    owner: analytics
    rationale: "EWMA control-limit width in sigma units."
    source: "Standard EWMA parameterisation."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: composite_flag_threshold
    value: 1.2
    owner: analytics
    rationale: >
      ANL-01-R01 transparent-composite score above which a provider lead is raised. This
      composite is the BENCHMARK every model must beat, so its threshold is set the
      way the design requires a threshold to be set — CALIBRATED TO REVIEWER CAPACITY, not to a
      fixed statistical significance level. At 1.2 the control raises roughly 17 provider
      leads per full run over 200 providers, which a four-reviewer team can absorb alongside
      the claim-level queue. The full score distribution (median 0.42, p95 1.44, max 2.21)
      is printed in validation_report.md so the position of this threshold within it is
      visible rather than asserted.
    source: "Calibrated to reviewer capacity to capacity; the score distribution it sits in is reported."
    approved_by: policy_owner
    expected_alert_volume: 17
    review_date: "2027-01-01"

  - key: composite_feature_weights
    value:
      amount_residual: 0.25
      amount_per_los_day_residual: 0.20
      pharmacy_share_residual: 0.15
      approval_ratio_residual: 0.15
      utilisation_velocity_residual: 0.10
      readmission_rate_residual: 0.08
      coding_mismatch_rate_residual: 0.07
    owner: policy_owner
    rationale: "Per-feature weights of the transparent composite. Weights are published so a reviewer can reconstruct the score by hand from the per-feature contributions shown in the UI."
    source: "Chosen for this artefact, scenario-aligned."
    approved_by: policy_owner
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Control-specific thresholds (referenced by rules/*.yaml as cfg.<key>)
  # ---------------------------------------------------------------------------
  - key: early_tenure_days
    value: 90
    owner: underwriting
    rationale: "A claim within this many days of policy inception is 'early tenure' (POL-01-R04, NET-04-R03). Early tenure is NEVER evidence of fraud on its own — the design says so explicitly and the control's disposition reflects that."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    expected_alert_volume: 260
    review_date: "2027-01-01"

  - key: readmit_window_days
    value: 30
    owner: clinical_policy
    rationale: "Readmission window for CLN-05-R02/R03. A related admission inside this window with payment impact triggers episode review — explicitly 'not a fraud label' (control catalogue, CLN-05-R02)."
    source: "Chosen for this artefact; 30 days is the common industry readmission window."
    approved_by: clinical_policy
    expected_alert_volume: 210
    review_date: "2027-01-01"

  - key: duplicate_window_days
    value: 7
    owner: claims_policy
    rationale: "Near-duplicate detection window for PAY-01-R02: same member, provider and diagnosis within this many days."
    source: "Chosen for this artefact."
    approved_by: claims_policy
    expected_alert_volume: 90
    review_date: "2027-01-01"

  - key: duplicate_amount_tolerance
    value: 0.05
    owner: claims_policy
    rationale: "Relative amount tolerance within which two claims are treated as the same billed service for PAY-01-R02 (5%)."
    source: "Chosen for this artefact."
    approved_by: claims_policy
    review_date: "2027-01-01"

  - key: exact_duplicate_amount_tolerance
    value: 0.0
    owner: claims_policy
    rationale: "PAY-01-R01 is a HARD edit and may REJECT. It therefore requires exact amount equality — no tolerance, no statistical judgement. This is the safety boundary expressed as a number."
    source: "the control catalogue PAY-01-R01."
    approved_by: claims_policy
    expected_alert_volume: 20
    review_date: "2027-01-01"

  - key: approval_ratio_peer_percentile
    value: 0.05
    owner: claims_policy
    rationale: >
      PAY-06-R04, first limb. the control catalogue says "persistently low approval ratio... VERSUS
      PEERS", so the comparison is to the peer distribution, not to a fixed ratio. A provider
      whose shrunk approved-to-billed ratio falls below this percentile of the peer
      distribution is flagged for education or audit — never denial. On the claim extract the lowest
      shrunk provider ratio is 0.651 and the median 0.859, so a fixed cut at, say, 0.55 could
      never fire; the percentile adapts to whatever the peer distribution actually is.
    source: "the control catalogue wording ('versus peers'); the percentile is chosen for this artefact."
    approved_by: claims_policy
    expected_alert_volume: 10
    review_date: "2027-01-01"

  - key: approval_ratio_invariance_percentile
    value: 0.05
    owner: claims_policy
    rationale: >
      PAY-06-R04, second limb: suspiciously INVARIANT approval (unusually low variance in the
      approval ratio) versus peers, which can indicate adjudication manipulation and links to
      PAY-11. Expressed as a percentile of the peer variance distribution for the same reason
      as the first limb.
    source: "the control catalogue wording; the percentile is chosen for this artefact."
    approved_by: claims_policy
    expected_alert_volume: 10
    review_date: "2027-01-01"

  - key: pharmacy_share_peer_multiple
    value: 2.0
    owner: pharmacy_policy
    rationale: "PHR-03-R03: pharmacy bill share exceeding this multiple of the diagnosis-peer median is a spike candidate."
    source: "Chosen for this artefact."
    approved_by: pharmacy_policy
    expected_alert_volume: 95
    review_date: "2027-01-01"

  - key: los_residual_threshold
    value: 3.0
    owner: clinical_policy
    rationale: "CLN-05-R01: robust residual of length of stay against the diagnosis-peer distribution, above/below which utilisation review is raised."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    expected_alert_volume: 140
    review_date: "2027-01-01"

  - key: utilisation_velocity_window_days
    value: 180
    owner: clinical_policy
    rationale: "CLN-04-R04: rolling window over which a member's or provider's service velocity is computed."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    review_date: "2027-01-01"

  - key: member_repeat_service_threshold
    value: 4
    owner: clinical_policy
    rationale: "CLN-04-R02: admissions per member within the velocity window above which episode-frequency excess is raised."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    expected_alert_volume: 110
    review_date: "2027-01-01"

  - key: min_repeat_interval_days
    value: 14
    owner: clinical_policy
    rationale: "CLN-04-R01: same/equivalent service repeated inside this interval without an accepted indicator."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    expected_alert_volume: 130
    review_date: "2027-01-01"

  - key: max_concurrent_admissions_per_member
    value: 1
    owner: claims_policy
    rationale: "ENT-02-R03: a member cannot be an inpatient in two places at once. Overlapping admissions for one member are an impossible-presence lead."
    source: "Physical impossibility; the tolerance, not the principle, is configurable."
    approved_by: claims_policy
    expected_alert_volume: 60
    review_date: "2027-01-01"

  - key: concurrent_admission_overlap_tolerance_days
    value: 0
    owner: claims_policy
    rationale: "Tolerance applied to overlap detection to absorb same-day transfer and date-only (no time) records. Zero means any strict overlap counts."
    source: "Chosen for this artefact."
    approved_by: claims_policy
    review_date: "2027-01-01"

  - key: provider_daily_capacity_admissions
    value: 40
    owner: provider_network
    rationale: "CLN-07-R02: conservative plausible concurrent-admission capacity per provider per day before throughput impossibility is raised. Deliberately generous so the control flags impossibility, not busyness."
    source: "Chosen for this artefact. A real deployment would take licensed bed counts from the regulator file."
    approved_by: provider_network
    expected_alert_volume: 45
    review_date: "2027-01-01"

  - key: capacity_tolerance_multiple
    value: 1.25
    owner: provider_network
    rationale: "Multiplier applied to declared capacity before a capacity breach is declared, absorbing roster and data-latency error (control catalogue, CLN-07-R02: 'missing roster produces low confidence')."
    source: "Chosen for this artefact."
    approved_by: provider_network
    review_date: "2027-01-01"

  - key: coding_mismatch_peer_percentile
    value: 0.95
    owner: coding_policy
    rationale: >
      CLN-01-R01. the control catalogue defines the trigger as a share that "exceeds shrunk PEER
      PERCENTILE", not a fixed rate, and this parameter is that percentile. An absolute rate
      would be wrong twice over: it would not adapt to a peer group's base rate, and on
      the claim extract the highest shrunk provider mismatch rate is 0.115, so any absolute cut above
      that would make the control unable to fire at all — which is a property of the number,
      not a finding about providers. At the 95th percentile the control raises roughly ten
      provider coding cases per run.
    source: "the control catalogue wording ('exceeds shrunk peer percentile'); the percentile is chosen for this artefact."
    approved_by: coding_policy
    expected_alert_volume: 10
    review_date: "2027-01-01"

  - key: cob_min_insurers
    value: 2
    owner: claims_policy
    rationale: "PAY-10-R01: number of insurers on the same event at or above which coordination of benefits must be evidenced."
    source: "Definitional."
    approved_by: claims_policy
    expected_alert_volume: 300
    review_date: "2027-01-01"

  - key: blacklist_requires_exact_match
    value: true
    owner: provider_network
    rationale: "ENT-03-R02 / CLN-06-R02: an exclusion-list match may only REJECT on an EXACT identifier match. A fuzzy match may only PEND. the control catalogue states this explicitly and the rule contract encodes it."
    source: "The control catalogue, ENT-03-R02."
    approved_by: provider_network
    review_date: "2027-01-01"

  - key: max_resubmission_attempts
    value: 3
    owner: claims_policy
    rationale: "PAY-08-R03: attempts per underlying service above which a resubmission-loop provider case is raised."
    source: "Chosen for this artefact."
    approved_by: claims_policy
    review_date: "2027-01-01"

  - key: max_member_travel_speed_kmh
    value: 900
    owner: claims_policy
    rationale: "ENT-02-R03 travel-speed impossibility limit. NOT_EXECUTABLE on the claim extract (no geography) and classified as such in the coverage matrix."
    source: "Commercial aviation cruise speed."
    approved_by: claims_policy
    review_date: "2027-01-01"

  - key: death_reporting_tolerance_days
    value: 2
    owner: claims_policy
    rationale: "ENT-02-R02 post-mortem service tolerance. NOT_EXECUTABLE on the claim extract (no death status)."
    source: "Chosen for this artefact."
    approved_by: claims_policy
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Network / graph
  # ---------------------------------------------------------------------------
  - key: graph_snapshot_period
    value: "W"
    owner: analytics
    rationale: "Graph edges are materialised into WEEKLY, time-bounded snapshots. An edge exists only within its snapshot window."
    source: "The graph design ('weekly snapshots')."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: referral_concentration_threshold
    value: 0.60
    owner: siu
    rationale: "NET-01-R01: share of an agent's or provider's flow going to a single counterparty above which concentration is flagged, subject to the peer comparison."
    source: "Chosen for this artefact."
    approved_by: siu
    expected_alert_volume: 35
    review_date: "2027-01-01"

  - key: community_min_size
    value: 4
    owner: siu
    rationale: "NET-02-R02: minimum Louvain community size before density statistics are computed, so that a two-node pair is not reported as a ring."
    source: "Chosen for this artefact."
    approved_by: siu
    review_date: "2027-01-01"

  - key: community_density_threshold
    value: 0.35
    owner: siu
    rationale: >
      NET-02-R02, ABSOLUTE FLOOR only. Retained because the control catalogue describes an absolute
      density notion, but it is not the executing test: in a bipartite claims graph density
      falls roughly as 1/size, so an absolute cut flags every small community and no large one
      (at 0.35 it raises 686 signals from the weekly snapshots and breaches the alert-volume
      ceiling). The executing test is the SIZE-MATCHED comparison below, which is what the
      catalogue's own exclusion column — "specialty/geography/SIZE MATCHED communities" —
      actually asks for.
    source: "the control catalogue; retained as a reported floor, superseded by the size-matched test."
    approved_by: siu
    expected_alert_volume: 0
    review_date: "2027-01-01"

  - key: community_density_peer_multiple
    value: 1.2
    owner: siu
    rationale: >
      NET-02-R02, executing test. A community is abnormally dense when its internal edge
      density exceeds this multiple of the MEDIAN DENSITY OF COMMUNITIES OF THE SAME SIZE,
      pooled across all weekly snapshots. Size matching is required because density is a
      function of size in a bipartite graph.
    source: "the control catalogue exclusion column ('size matched communities'); the multiple is chosen for this artefact."
    approved_by: siu
    expected_alert_volume: 2
    review_date: "2027-01-01"

  - key: community_external_flow_max
    value: 0.30
    owner: siu
    rationale: >
      NET-02-R02 second condition: "LOW EXTERNAL FLOW". The share of a community's edges that
      leave the community must be below this for the community to be treated as closed. A
      dense community with high external flow is a hub, not a ring.
    source: "the control catalogue trigger wording; the value is chosen for this artefact."
    approved_by: siu
    review_date: "2027-01-01"

  - key: community_min_distinct_members
    value: 2
    owner: siu
    rationale: >
      NET-02-R02 third condition. "Member CIRCULATION" requires at least two members and at
      least two providers; a star of one provider and several members is a busy clinic, and
      flagging it would fill the queue with ordinary structure.
    source: "the control catalogue trigger wording ('member/provider edge density')."
    approved_by: siu
    review_date: "2027-01-01"

  - key: entity_resolution_auto_merge_min_confidence
    value: 1.01
    owner: administrator
    rationale: "DELIBERATELY UNREACHABLE (>1.0). The design prohibits automatic merging of low-confidence matches; this artefact never auto-merges at all. Every candidate is surfaced for human confirmation."
    source: "Explicit prohibition on automatic merging."
    approved_by: administrator
    review_date: "2027-01-01"

  - key: entity_resolution_review_min_confidence
    value: 0.60
    owner: administrator
    rationale: "Minimum match confidence for a candidate pair to be SURFACED to a human reviewer. Below this it is noise."
    source: "Chosen for this artefact."
    approved_by: administrator
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Model layer
  # ---------------------------------------------------------------------------
  - key: model_train_fraction
    value: 0.6
    owner: analytics
    rationale: "Fraction of the claim-date-ordered timeline used for model TRAINING. The split is strictly temporal — training data is always earlier than scoring data."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: isolation_forest_n_estimators
    value: 300
    owner: analytics
    rationale: "Isolation Forest ensemble size (Liu et al., 2008)."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: isolation_forest_contamination
    value: 0.05
    owner: analytics
    rationale: "Nominal contamination used only to initialise the score; the OPERATIONAL threshold is set by reviewer capacity, not by this value."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: lof_n_neighbors
    value: 35
    owner: analytics
    rationale: "Local Outlier Factor neighbourhood size (Breunig et al., 2000). LOF is retained because it surfaces anomalies that are only anomalous relative to a local peer cluster."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: psi_warn_threshold
    value: 0.10
    owner: analytics
    rationale: "Population Stability Index above which drift is WARNED."
    source: "Conventional PSI banding (0.1 / 0.25)."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: psi_breach_threshold
    value: 0.25
    owner: analytics
    rationale: "PSI above which drift is BREACHED and recalibration or kill switch is recommended."
    source: "Conventional PSI banding."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: model_promotion_min_lift
    value: 1.10
    owner: policy_owner
    rationale: "Minimum PROSPECTIVE lift in review yield over the ANL-01-R01 transparent composite, on a strictly later period, before a model may move from shadow to active. If the model does not clear this, the honest verdict is printed and the model stays in shadow."
    source: "The design specification the promotion gate requires demonstrated prospective lift; the 1.10 factor is chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: model_calibration_max_ece
    value: 0.15
    owner: analytics
    rationale: "Maximum expected calibration error permitted at the model promotion gate."
    source: "Chosen for this artefact."
    approved_by: analytics
    review_date: "2027-01-01"

  - key: novel_cluster_min_size
    value: 8
    owner: policy_owner
    rationale: >
      ANL-01-R04: minimum HDBSCAN cluster size before a residual-space cluster is proposed as
      a candidate typology for the quarterly review. Disposition is MONITOR_ONLY only. The
      value is bounded by the population that is actually scored: entity isolation leaves 95
      providers in the scoring set, so a minimum of 15 would require a single typology to
      cover 16% of all scored providers and produces zero clusters. Eight is roughly 8% of the
      scored population — small enough to surface a pattern, large enough that a cluster is
      not three providers and a coincidence.
    source: "Chosen for this artefact, bounded by the entity-isolated scoring population."
    approved_by: policy_owner
    expected_alert_volume: 3
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Priority score — coefficients are reproduced from the design specification
  # ---------------------------------------------------------------------------
  - key: priority_weights
    value:
      evidence_strength: 1.10
      log_exposure: 0.80
      independent_domain_count: 0.55
      validated_prior_history: 0.45
      recency: 0.25
      data_quality_penalty: -0.60
      known_exception_strength: -0.50
    owner: policy_owner
    rationale: "Reproduced EXACTLY from the design specification. These are not tunable in this artefact without a recorded governance change, because the formula's auditability is the point: the UI renders each term's contribution."
    source: "Design specification for the priority formula."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: priority_exposure_scale_aed
    value: 1000.0
    owner: policy_owner
    rationale: "Divisor inside log1p(exposure_aed / 1000) in the priority formula."
    source: "Design specification for the priority formula."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: recency_half_life_days
    value: 120
    owner: policy_owner
    rationale: "Half-life used to normalise the `recency` term of the priority formula into [0,1]."
    source: "Chosen for this artefact; the design specifies the term, not its shape."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: max_independent_domains
    value: 5
    owner: policy_owner
    rationale: "Normaliser for independent_domain_count (rule / statistical / network / document / model)."
    source: "Derived from the five detection domains."
    approved_by: policy_owner
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Release gates — acceptance thresholds, not achieved results
  # ---------------------------------------------------------------------------
  - key: gate_key_linkage_min
    value: 0.995
    owner: qa
    rationale: "Data-readiness gate: ≥99.5% key linkage for claims and lines. Quoted from the specification as an acceptance criterion, NOT as a result."
    source: "Release-gate acceptance criteria."
    approved_by: qa
    review_date: "2027-01-01"

  - key: gate_hard_edit_reproducibility_min
    value: 0.99
    owner: qa
    rationale: "Hard-edit gate: ≥99% decision reproducibility. Quoted as an acceptance criterion."
    source: "Release-gate acceptance criteria."
    approved_by: qa
    review_date: "2027-01-01"

  - key: gate_statistical_min_review_yield
    value: 0.20
    owner: policy_owner
    rationale: "Statistical-rule gate: review yield above an agreed baseline after a prospective shadow period."
    source: "Chosen for this artefact; the design requires a baseline, not a number."
    approved_by: policy_owner
    review_date: "2027-01-01"

  - key: shadow_period_min_days
    value: 30
    owner: policy_owner
    rationale: "Minimum prospective shadow period before a statistical rule may be considered for activation."
    source: "Chosen for this artefact."
    approved_by: policy_owner
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Latency ceilings — monitored, reported in the Governance page
  # ---------------------------------------------------------------------------
  - key: latency_ceiling_ms
    value:
      INGEST: 1000
      PREPAY_SYNC: 500
      PREPAY_ASYNC: 600000
      POSTPAY_DAILY: 86400000
      NETWORK_WEEKLY: 604800000
      MODEL_MONTHLY: 2592000000
    owner: platform_engineering
    rationale: "Maximum expected latency per execution stage, reproduced from the design specification. Measured per stage during the validation run and reported against the ceiling."
    source: "Stage latency ceilings."
    approved_by: platform_engineering
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # Document / NLP
  # ---------------------------------------------------------------------------
  - key: nlp_min_extraction_confidence
    value: 0.55
    owner: clinical_policy
    rationale: "Minimum OCR-adjusted extraction confidence for a DOC/CLN-01-R03 finding to be rendered. A finding with NO SOURCE SPAN is discarded entirely regardless of confidence (non-negotiable)."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    review_date: "2027-01-01"

  - key: nlp_synthetic_inconsistency_rate
    value: 0.12
    owner: qa
    rationale: "Share of generated SYNTHETIC discharge summaries deliberately made inconsistent with their claim, so the document pipeline has both positive and negative cases. Every such document is marked SYNTHETIC in its filename and body."
    source: "Chosen for this artefact."
    approved_by: qa
    review_date: "2027-01-01"

  - key: doc_clone_similarity_threshold
    value: 0.92
    owner: clinical_policy
    rationale: "DOC-02-R01 cross-patient near-duplicate similarity threshold, computed after boilerplate removal."
    source: "Chosen for this artefact."
    approved_by: clinical_policy
    review_date: "2027-01-01"

  # ---------------------------------------------------------------------------
  # AI layer
  # ---------------------------------------------------------------------------
  - key: ai_enabled
    value: true
    owner: administrator
    rationale: "Master switch for the entire AI layer. The tool must remain fully functional with this false — enforced by tests/governance/test_ai_disabled.py."
    source: "Design specification for the AI layer."
    approved_by: administrator
    review_date: "2027-01-01"

  - key: ai_provider
    value: "offline_deterministic"
    owner: administrator
    rationale: "Default LLM provider. OfflineDeterministicProvider requires no API key and no network, so the artefact is reproducible and demonstrable offline."
    source: "Design specification for the AI layer."
    approved_by: administrator
    review_date: "2027-01-01"

  - key: ai_features_enabled
    value:
      grounded_narrative: true
      rule_authoring: true
      reviewer_copilot: true
      typology_triage: true
    owner: administrator
    rationale: "Each AI feature is INDEPENDENTLY switchable. No AI feature may set or change a disposition, priority or exposure under any setting."
    source: "Design specification for the AI layer."
    approved_by: administrator
    review_date: "2027-01-01"
