# Plain-language labels for internal column and field names.
#
# Presentation only: nothing here renames anything in code. Each key is the
# exact internal name the app looks up; `label` is the short heading shown to a
# reader and `meaning` is one plain sentence saying what the value is.
#
# Readers are claims reviewers, audit managers and thesis examiners — people
# who know health insurance well but are not data scientists.

fields:

  # ===========================================================================
  # Identifiers and references
  # ===========================================================================
  claim_sk:
    label: "Claim reference"
    meaning: "The reference that identifies this claim throughout the system."
  claim_id:
    label: "Claim reference (as supplied)"
    meaning: "The claim number exactly as it appears in the source file."
  source_claim_id:
    label: "Original claim number"
    meaning: "The claim number used by the system that sent the claim."
  claim_ids:
    label: "Claims involved"
    meaning: "The references of every claim this finding rests on."
  claim_sks:
    label: "Claims involved"
    meaning: "The references of every claim this finding rests on."
  member_sk:
    label: "Patient reference"
    meaning: "The reference that identifies the insured patient (the member)."
  member_sks:
    label: "Patients involved"
    meaning: "The references of every patient this finding involves."
  patient_id:
    label: "Patient reference (as supplied)"
    meaning: "The patient number exactly as it appears in the source file."
  source_member_id:
    label: "Original patient number"
    meaning: "The patient number used by the system that sent the data."
  provider_sk:
    label: "Provider reference"
    meaning: "The reference that identifies the hospital, clinic or other provider."
  hospital_id:
    label: "Hospital reference (as supplied)"
    meaning: "The hospital number exactly as it appears in the source file."
  source_provider_id:
    label: "Original provider number"
    meaning: "The provider number used by the system that sent the data."
  prior_provider_sk:
    label: "Earlier provider"
    meaning: "The provider that treated the patient on the earlier, related claim."
  top_provider_sk:
    label: "Most-used provider"
    meaning: "The provider that received the largest share of this agent's claims."
  agent_id:
    label: "Agent reference"
    meaning: "The insurance agent or intermediary linked to the claim."
  encounter_sk:
    label: "Hospital visit reference"
    meaning: "The reference for the hospital visit or stay that the claim covers."
  line_sk:
    label: "Claim line reference"
    meaning: "The reference for one billed service line within a claim."
  episode_id:
    label: "Treatment episode reference"
    meaning: "Groups claims that belong to the same course of treatment for the same patient."
  coverage_id:
    label: "Cover reference"
    meaning: "The reference for the patient's period of insurance cover."
  authorization_sk:
    label: "Prior approval reference"
    meaning: "The reference for a prior-approval (authorisation) request."
  authorization_line_sk:
    label: "Prior approval line reference"
    meaning: "The reference for one approved service within a prior approval."
  authorization_id:
    label: "Prior approval number"
    meaning: "The prior-approval number quoted on this service line."
  observation_sk:
    label: "Result reference"
    meaning: "The reference for a test result, report or other clinical observation."
  remittance_sk:
    label: "Payment advice reference"
    meaning: "The reference for the insurer's payment decision on a claim."
  rx_sk:
    label: "Prescription reference"
    meaning: "The reference for a prescription and its dispensing record."
  policy_event_sk:
    label: "Policy change reference"
    meaning: "The reference for an enrolment, addition, removal or correction on a policy."
  review_id:
    label: "Review reference"
    meaning: "The reference for a reviewer's recorded decision."
  case_id:
    label: "Case reference"
    meaning: "The reference for a review case, which groups related findings."
  signal_id:
    label: "Finding reference"
    meaning: "The reference for one individual finding raised by a check."
  signal_ids:
    label: "Findings reviewed"
    meaning: "The references of the findings this review decision covers."
  related_signal_ids:
    label: "Related findings"
    meaning: "Other findings that rest on the same facts as this one."
  prior_claim_sk:
    label: "Earlier claim"
    meaning: "The earlier claim this claim is linked to or compared with."
  matched_claim_sk:
    label: "Matching claim"
    meaning: "The other claim that this claim appears to repeat."
  duplicate_of_claim_sk:
    label: "Appears to repeat claim"
    meaning: "The earlier claim that this claim appears to duplicate."
  explained_claim_sk:
    label: "Claim explained"
    meaning: "The claim whose score is broken down in this explanation."
  tenant_id:
    label: "Organisation reference"
    meaning: "Which insurer or organisation the data belongs to; each organisation's data is kept separate."
  payer_id:
    label: "Payer reference"
    meaning: "The insurer or administrator responsible for paying the claim."
  tpa:
    label: "Claims administrator"
    meaning: "The third-party administrator that handled the claim on the insurer's behalf."
  sponsor_id:
    label: "Sponsor reference"
    meaning: "The person or organisation that sponsors the patient's cover."
  employer_id:
    label: "Employer reference"
    meaning: "The patient's employer, where cover is provided through work."
  facility_id:
    label: "Facility reference"
    meaning: "The hospital or clinic where the care took place."
  regulator_id:
    label: "Regulator licence reference"
    meaning: "The provider's identifier issued by the health regulator."
  licence_no:
    label: "Licence number"
    meaning: "The provider's licence number."
  owner_entity_id:
    label: "Owner reference"
    meaning: "The organisation that owns the provider, used to spot linked providers."
  performing_entity_id:
    label: "Performing provider"
    meaning: "The provider or unit that actually carried out the service."
  rendering_clinician_id:
    label: "Treating clinician"
    meaning: "The clinician who carried out the service."
  ordering_clinician_id:
    label: "Ordering clinician"
    meaning: "The clinician who ordered the service."
  prescriber_id:
    label: "Prescriber"
    meaning: "The clinician who wrote the prescription."
  pharmacy_id:
    label: "Pharmacy"
    meaning: "The pharmacy that dispensed the medicine."
  request_id:
    label: "Approval request number"
    meaning: "The number of the prior-approval request sent by the provider."
  response_id:
    label: "Approval response number"
    meaning: "The number of the insurer's reply to the prior-approval request."
  payment_reference:
    label: "Payment reference"
    meaning: "The reference of the payment made on the claim."
  protected_id_token:
    label: "Protected identity code"
    meaning: "A scrambled code that links records for the same person without revealing who they are."
  bank_account_token:
    label: "Protected bank account code"
    meaning: "A scrambled code for the provider's bank account, used only to spot providers that share one."
  phone_token:
    label: "Protected phone number code"
    meaning: "A scrambled code for the provider's phone number, used only to spot providers that share one."
  address_token:
    label: "Protected address code"
    meaning: "A scrambled code for the provider's address, used only to spot providers that share one."
  cross_payer_match_token:
    label: "Cross-insurer matching code"
    meaning: "A scrambled code that lets the same claim be recognised when it is sent to more than one insurer."
  device_serial:
    label: "Device serial number"
    meaning: "The serial number of a medical device supplied to the patient."
  bed_id:
    label: "Bed reference"
    meaning: "The bed the patient occupied during the stay."
  attachment_ref:
    label: "Attachment reference"
    meaning: "The reference of a document or image attached to the result."
  version_id:
    label: "Version"
    meaning: "Which version of this record or rule is being used."
  cluster_id:
    label: "Group reference"
    meaning: "The reference of a group of providers that behave alike."
  community_id:
    label: "Network group reference"
    meaning: "The reference of a closely connected group of patients, providers and agents."
  segment_id:
    label: "Period segment"
    meaning: "Which stretch of time, between known changes, the comparison was made within."
  entity:
    label: "Subject"
    meaning: "The provider, patient or agent the figures describe."
  entity_a:
    label: "First provider in pair"
    meaning: "The first of two providers that may be the same organisation."
  entity_b:
    label: "Second provider in pair"
    meaning: "The second of two providers that may be the same organisation."
  entity_type:
    label: "Kind of subject"
    meaning: "Whether the pair are providers, patients or agents."
  subject_id:
    label: "Subject"
    meaning: "The claim, patient, provider or agent the finding is about."
  subject_type:
    label: "Kind of subject"
    meaning: "Whether the finding is about a claim, a patient, a provider, an agent or a group."
  subject:
    label: "Subject"
    meaning: "What the event or finding is about."
  agent:
    label: "Agent"
    meaning: "The insurance agent or intermediary."
  member:
    label: "Patient"
    meaning: "The insured patient."
  provider:
    label: "Provider"
    meaning: "The hospital, clinic or other provider."
  case:
    label: "Case"
    meaning: "The review case this row belongs to."
  pair:
    label: "Pair of providers"
    meaning: "Two providers whose behaviour is similar enough that they may be the same organisation."
  nodes:
    label: "Members of the group"
    meaning: "The patients, providers and agents that make up the group."
  members:
    label: "Members"
    meaning: "The providers (or other subjects) that belong to this group."

  # ===========================================================================
  # Patient (member) details
  # ===========================================================================
  date_of_birth:
    label: "Date of birth"
    meaning: "The patient's date of birth."
  sex:
    label: "Sex"
    meaning: "The patient's recorded sex."
  death_date:
    label: "Date of death"
    meaning: "The date the patient died, if recorded."
  death_source:
    label: "Source of death record"
    meaning: "Where the date of death came from."
  death_source_confidence:
    label: "Confidence in death record"
    meaning: "How reliable the source of the death record is thought to be, from 0 to 1."
  height_cm:
    label: "Height (cm)"
    meaning: "The patient's recorded height."
  weight_kg:
    label: "Weight (kg)"
    meaning: "The patient's recorded weight."

  # ===========================================================================
  # Cover and policy
  # ===========================================================================
  product:
    label: "Insurance product"
    meaning: "The insurance plan or product the patient is covered under."
  product_tier:
    label: "Product tier"
    meaning: "The level of the insurance plan, such as basic or enhanced."
  policy_type:
    label: "Policy type"
    meaning: "The kind of insurance policy, such as individual, family or group."
  valid_from:
    label: "Valid from"
    meaning: "The date from which this record, rule or setting applies."
  valid_to:
    label: "Valid to"
    meaning: "The date after which this record, rule or setting no longer applies."
  network:
    label: "Provider network"
    meaning: "The network of providers the patient's plan allows."
  status:
    label: "Status"
    meaning: "The current state of this item."
  policy_inception_date:
    label: "Policy start date"
    meaning: "The date the patient's policy began."
  days_since_policy_start:
    label: "Policy age at treatment (days)"
    meaning: "How many days the policy had been in force when treatment took place."
  early_tenure_days:
    label: "New-policy period (days)"
    meaning: "The number of days after a policy starts during which a claim counts as early."
  previous_fraud_on_policy:
    label: "Earlier fraud noted on policy"
    meaning: "Whether an earlier fraud finding is recorded against this policy; it is a history note, not the answer for this claim."
  event_type:
    label: "Event"
    meaning: "What kind of event was recorded."
  actor:
    label: "Done by"
    meaning: "The person or process that carried out the action."
  actor_role:
    label: "Role of the person acting"
    meaning: "The job role of the person who carried out the action."
  event_time:
    label: "When it happened"
    meaning: "The date and time the event took place."
  effective_date:
    label: "Takes effect from"
    meaning: "The date the change takes effect."

  # ===========================================================================
  # Benefit rules
  # ===========================================================================
  service_family:
    label: "Service category"
    meaning: "The broad group of services a benefit rule applies to."
  covered:
    label: "Covered"
    meaning: "Whether the service is covered by the plan."
  benefit_limit:
    label: "Benefit limit"
    meaning: "The most the plan will pay for this kind of service."
  patient_share_pct:
    label: "Patient's share (%)"
    meaning: "The percentage of the cost the patient must pay themselves."
  authorization_required:
    label: "Prior approval needed"
    meaning: "Whether the insurer must approve the service before it is provided."
  exceptions:
    label: "Exceptions"
    meaning: "Situations where the benefit rule does not apply in the usual way."
  recorded_at:
    label: "Recorded on"
    meaning: "When this record was written into the system."
  source:
    label: "Source"
    meaning: "Where this information or setting came from."

  # ===========================================================================
  # Provider
  # ===========================================================================
  provider_type:
    label: "Provider type"
    meaning: "The kind of provider, such as hospital, clinic or pharmacy."
  specialty:
    label: "Specialty"
    meaning: "The provider's main medical specialty."
  facility_type:
    label: "Facility type"
    meaning: "The kind of facility, such as general hospital or day-surgery centre."
  emirate:
    label: "Emirate"
    meaning: "The emirate where the provider is located."
  volume_band:
    label: "Size band"
    meaning: "How busy the provider is, grouped by the number of claims it submits."
  credentialing_date:
    label: "Date approved to join network"
    meaning: "When the provider was checked and approved to treat the insurer's patients."
  bed_count:
    label: "Number of beds"
    meaning: "How many beds the provider has."
  operational_status:
    label: "Operating status"
    meaning: "Whether the provider is open, suspended or closed."
  ownership_changed_on:
    label: "Ownership changed on"
    meaning: "The date the provider last changed owner."
  status_type:
    label: "Kind of status"
    meaning: "What the status is about, such as licence, network membership or an exclusion list."
  status_value:
    label: "Status value"
    meaning: "The provider's status of that kind, for example active or excluded."
  match_type:
    label: "How it was matched"
    meaning: "Whether the records were matched exactly or approximately."
  claim_count:
    label: "Number of claims"
    meaning: "How many claims are counted here."

  # ===========================================================================
  # Claim header
  # ===========================================================================
  submission_date:
    label: "Date submitted"
    meaning: "The date the claim was sent to the insurer."
  settlement_date:
    label: "Date paid"
    meaning: "The date the claim was settled."
  gross_amount:
    label: "Amount billed (source currency)"
    meaning: "The total amount the provider charged, in the currency of the source file."
  net_amount:
    label: "Net amount (source currency)"
    meaning: "The amount due after discounts and the patient's share, in the currency of the source file."
  patient_share:
    label: "Patient's share"
    meaning: "The part of the cost the patient paid themselves."
  approved_amount:
    label: "Amount approved (source currency)"
    meaning: "What the insurer agreed to pay, in the currency of the source file."
  source_currency:
    label: "Source currency"
    meaning: "The currency the amounts were originally recorded in."
  gross_amount_aed:
    label: "Amount billed (AED)"
    meaning: "The total amount the provider charged, converted to dirhams at the rate on the date of treatment."
  approved_amount_aed:
    label: "Amount approved (AED)"
    meaning: "What the insurer agreed to pay, converted to dirhams."
  fx_rate_used:
    label: "Exchange rate used"
    meaning: "The rate used to convert the amount into dirhams."
  fx_rate_source:
    label: "Where the exchange rate came from"
    meaning: "The source of the exchange rate and the date it was taken for."
  is_cashless:
    label: "Billed directly to insurer"
    meaning: "Whether the hospital billed the insurer directly (cashless) instead of the patient paying and claiming back."
  num_insurers_same_event:
    label: "Insurers billed for the same stay"
    meaning: "How many insurers were billed for the same hospital stay."
  source_system:
    label: "Source system"
    meaning: "The system or data feed the record came from."
  raw_hash:
    label: "Original-row fingerprint"
    meaning: "A tamper-evident fingerprint of the original row, taken before any processing."
  source_vocabulary:
    label: "Original row as received"
    meaning: "The original values from the source file, kept so every figure can be traced back."
  missingness:
    label: "Missing information"
    meaning: "Notes on which details the source did not supply."
  claim_type:
    label: "Claim type"
    meaning: "The kind of claim, such as inpatient, outpatient or pharmacy."
  accident_indicator:
    label: "Accident-related"
    meaning: "Whether the treatment followed an accident, which may make another party liable."
  discount:
    label: "Discount"
    meaning: "Any discount applied to the amount billed."
  service_date:
    label: "Date of treatment"
    meaning: "The date the treatment or admission took place."
  discharge_date:
    label: "Discharge date"
    meaning: "The date the patient left hospital."
  claim_date:
    label: "Claim date"
    meaning: "The date the claim was made."
  length_of_stay_days:
    label: "Length of stay (days)"
    meaning: "How many days the patient stayed in hospital."
  diagnosis_primary:
    label: "Main diagnosis code"
    meaning: "The code for the main condition being treated."
  diagnosis_chapter:
    label: "Diagnosis group"
    meaning: "The broad body system or disease group the main diagnosis belongs to."
  diagnosis_description:
    label: "Main diagnosis"
    meaning: "The main condition being treated, in words."
  pharmacy_bill_ratio:
    label: "Share of the bill spent on medicines"
    meaning: "The part of the total bill that was for medicines, from 0 to 1."
  icd_code_matches_procedure:
    label: "Diagnosis fits the procedure"
    meaning: "Whether the diagnosis code is consistent with the procedure billed."
  provider_blacklist_flag:
    label: "Provider on exclusion list"
    meaning: "Whether the provider is on a list of providers the insurer should not pay."
  discharge_readmit_gap_days:
    label: "Days until readmission"
    meaning: "How many days passed between this discharge and the patient's next admission."

  # ===========================================================================
  # Source file columns (claim extract)
  # ===========================================================================
  date_of_admission:
    label: "Admission date (as supplied)"
    meaning: "The admission date exactly as it appears in the source file."
  date_of_discharge:
    label: "Discharge date (as supplied)"
    meaning: "The discharge date exactly as it appears in the source file."
  date_of_claim:
    label: "Claim date (as supplied)"
    meaning: "The claim date exactly as it appears in the source file."
  claim_amount_requested_inr:
    label: "Amount claimed by provider"
    meaning: "What the provider asked the insurer to pay on this claim, in the source currency."
  claim_amount_approved_inr:
    label: "Amount approved by insurer"
    meaning: "What the insurer agreed to pay on this claim, in the source currency."
  fraud_label:
    label: "Answer key: fraud or not"
    meaning: "A held-out evaluation label saying whether the claim is known to be fraudulent; it is used only to measure results and never for detection."
  fraud_type:
    label: "Answer key: kind of fraud"
    meaning: "A held-out evaluation label naming the kind of fraud; it is used only to measure results and never for detection."
  fraud_confidence:
    label: "Answer key: confidence"
    meaning: "A held-out evaluation label saying how sure the source is about the fraud answer; it is used only to measure results and never for detection."
  ground_truth_source:
    label: "Answer key: where it came from"
    meaning: "A held-out evaluation label saying how the fraud answer was established; it is used only to measure results and never for detection."

  # ===========================================================================
  # Claim lines
  # ===========================================================================
  activity_type:
    label: "Service type"
    meaning: "The kind of service billed, such as procedure, test, medicine or consultation."
  activity_code:
    label: "Service code"
    meaning: "The code for the specific service billed."
  activity_description:
    label: "Service description"
    meaning: "The service billed, in words."
  units:
    label: "Quantity"
    meaning: "How many units of the service were billed."
  indicator:
    label: "Billing modifier"
    meaning: "A marker on the line that changes how it is paid, such as a repeat or a bilateral procedure."
  service_start_time:
    label: "Service start time"
    meaning: "When the service began."
  service_end_time:
    label: "Service end time"
    meaning: "When the service ended."
  wastage_units:
    label: "Units wasted"
    meaning: "How many units of a medicine or supply were billed as discarded."
  unit_price:
    label: "Price per unit"
    meaning: "The price charged for one unit of the service."

  # ===========================================================================
  # Diagnosis
  # ===========================================================================
  code:
    label: "Diagnosis code"
    meaning: "The code for the condition."
  code_system:
    label: "Coding system"
    meaning: "The coding system the diagnosis code comes from."
  code_version:
    label: "Coding system version"
    meaning: "Which edition of the coding system was used."
  diagnosis_type:
    label: "Diagnosis role"
    meaning: "Whether this is the main diagnosis or a secondary one."
  sequence:
    label: "Order"
    meaning: "The position of this item in its list."
  present_on_admission:
    label: "Present on admission"
    meaning: "Whether the condition was already present when the patient was admitted."
  description:
    label: "Description"
    meaning: "A description in words."
  chapter:
    label: "Diagnosis group"
    meaning: "The broad body system or disease group the diagnosis belongs to."

  # ===========================================================================
  # Encounter (hospital visit)
  # ===========================================================================
  encounter_type:
    label: "Visit type"
    meaning: "Whether the visit was an inpatient stay, outpatient visit, emergency or day case."
  start_time:
    label: "Visit start"
    meaning: "When the visit or stay began."
  end_time:
    label: "Visit end"
    meaning: "When the visit or stay ended."
  admission_date:
    label: "Admission date"
    meaning: "The date the patient was admitted."
  location:
    label: "Location"
    meaning: "Where the care was given."
  duration_minutes:
    label: "Duration (minutes)"
    meaning: "How long the visit or service lasted."
  observation_status:
    label: "Held for observation"
    meaning: "Whether the patient was kept for observation rather than formally admitted."
  admission_type:
    label: "Admission type"
    meaning: "How the patient was admitted, such as planned or emergency."
  discharge_type:
    label: "Discharge type"
    meaning: "How the stay ended, such as home, transfer or death."

  # ===========================================================================
  # Observation (results and reports)
  # ===========================================================================
  observation_type:
    label: "Result type"
    meaning: "The kind of result or report."
  observation_code:
    label: "Result code"
    meaning: "The code for the test or observation."
  value:
    label: "Value"
    meaning: "The value recorded or measured."
  unit:
    label: "Unit"
    meaning: "The unit the value is measured in."

  # ===========================================================================
  # Prior approval (authorisation)
  # ===========================================================================
  approved_units:
    label: "Units approved"
    meaning: "How many units of the service the insurer approved in advance."
  approved_value:
    label: "Value approved"
    meaning: "The amount the insurer approved in advance for the service."
  conditions:
    label: "Conditions of approval"
    meaning: "Any conditions attached to the prior approval."
  denial_code:
    label: "Refusal reason code"
    meaning: "The code giving the reason a service or claim was refused."

  # ===========================================================================
  # Claim versions
  # ===========================================================================
  version_no:
    label: "Version number"
    meaning: "Which submission of the claim this is: 1 for the original, higher numbers for later corrections."
  relationship:
    label: "Relationship to earlier version"
    meaning: "Whether this is the original, a resubmission or a correction."
  changed_fields:
    label: "What changed"
    meaning: "Which details were changed from the earlier version of the claim."
  resubmission_type:
    label: "Resubmission type"
    meaning: "Why the claim was sent again, such as a correction or an appeal of a refusal."

  # ===========================================================================
  # Remittance (payment decisions)
  # ===========================================================================
  decision:
    label: "Payment decision"
    meaning: "Whether the insurer paid, part-paid or refused the claim or line."
  adjustment:
    label: "Adjustment"
    meaning: "The amount by which the insurer changed the payment."
  payment_amount:
    label: "Amount paid"
    meaning: "The amount the insurer actually paid."

  # ===========================================================================
  # Prescriptions and dispensing
  # ===========================================================================
  prescribed_product:
    label: "Medicine prescribed"
    meaning: "The medicine the clinician prescribed."
  billed_product:
    label: "Medicine billed"
    meaning: "The medicine the pharmacy charged for."
  dispensed_product:
    label: "Medicine dispensed"
    meaning: "The medicine actually handed to the patient."
  prescribed_qty:
    label: "Quantity prescribed"
    meaning: "How much of the medicine was prescribed."
  dispensed_qty:
    label: "Quantity dispensed"
    meaning: "How much of the medicine was handed to the patient."
  billed_qty:
    label: "Quantity billed"
    meaning: "How much of the medicine was charged for."
  billed_amount:
    label: "Amount billed"
    meaning: "The amount charged for the medicine."
  days_supply:
    label: "Days of supply"
    meaning: "How many days the dispensed medicine should last."
  fill_date:
    label: "Date dispensed"
    meaning: "The date the pharmacy handed over the medicine."
  prescribed_date:
    label: "Date prescribed"
    meaning: "The date the prescription was written."
  form:
    label: "Medicine form"
    meaning: "The form of the medicine, such as tablet, injection or syrup."
  strength_mg:
    label: "Strength (mg)"
    meaning: "The strength of each dose of the medicine."
  dose_mg_per_day:
    label: "Daily dose (mg)"
    meaning: "How much of the medicine the patient takes each day."

  # ===========================================================================
  # Review outcomes
  # ===========================================================================
  reviewer:
    label: "Reviewer"
    meaning: "The person who reviewed the case."
  reviewer_role:
    label: "Reviewer's role"
    meaning: "The job role of the person who reviewed the case."
  disposition:
    label: "Recommended action"
    meaning: "What should happen next, such as hold for review, audit after payment or monitor only."
  validated_category:
    label: "Confirmed category"
