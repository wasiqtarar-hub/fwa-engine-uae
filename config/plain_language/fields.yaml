    meaning: "The column in this file used for the characteristic."
  dataset_mapping:
    label: "Taken from"
    meaning: "The column in this file used for the characteristic."
  availability:
    label: "Availability"
    meaning: "Whether this file supplies the characteristic fully, through a stand-in, or not at all."
  available:
    label: "Available"
