# =============================================================================
# Plain-language wording for the Data, Help and Validation Report pages.
#
# Presentation only. Nothing here renames an internal identifier: every key on
# the left is the exact value the engine or the app produces (file names,
# adapter names, gate criterion names), and the words on the right are what a
# reader sees.
#
# The standard loader merges `glossary:` into the shared vocabulary (only NEW
# keys are added here). The `data_help_pages:` section is ignored by the loader
# and read directly by app/components/data_help.py.
# =============================================================================

glossary:
  source_format:
    term: "File format (adapter)"
    also_called: ["adapter", "source schema"]
    short: "Tells the engine how the columns in your file are laid out, so it can find the claim, patient, provider and amount in each row."
    explanation: "Insurers and regulators lay out claim files differently. The file format setting picks the translator that reads your layout into the engine's own standard layout. If you pick the wrong one, nothing is silently mis-read: columns the translator cannot find are recorded as missing, and the checks that need them are reported as unable to run."
    analogy: "Like choosing the right language before a document is translated: pick the wrong one and the translator tells you it cannot read it, rather than guessing."
    in_this_app: "Pick 'UAE multi-table' for the UAE demo folder or zip, 'Generic claim list' for a file with one row per claim, and the Shafafiya or eClaimLink options for files in those regulators' layouts (not yet certified against a live feed)."
  check_coverage:
    term: "Check coverage (data support)"
    also_called: ["data support", "executable", "partial", "not executable"]
    short: "Whether each of the 164 checks could run on the loaded file: fully, in a simplified form, or not at all because information was missing."
    explanation: "Every check needs certain information, for example line-level service details or prior approvals. If the file has all of it, the check runs fully. If it has only a stand-in, the check runs in a simplified form and says so on every flag it raises. If the information is missing altogether, the check is not run rather than guessed."
    analogy: "Like a blood test that needs a particular sample: with the right sample you get the full result, with a partial one you get a limited result, and with none the lab says it cannot do the test."
    in_this_app: "The Data page groups the checks that could not run by the information they are missing, which tells you what richer data would unlock."
  synthetic_dataset:
    term: "Synthetic data"
    also_called: ["SYNTHETIC", "demo data"]
    short: "Claims generated by a program to exercise the engine; no row describes a real person, provider or claim."
    explanation: "The demonstration files were generated with known patterns planted in them, so every part of the engine has something to find. That makes them good for testing that the checks and gates work, and useless for judging how well the engine would detect fraud in real claims."
    analogy: "Like a fire drill: it shows the alarms and exits work, not how a real fire would go."
    in_this_app: "Any synthetic file is labelled SYNTHETIC wherever its numbers appear. A check that passes on data built to pass it is a test of the check, not evidence that it detects fraud."
  not_measurable:
    term: "Can't be measured yet"
    also_called: ["not measurable", "not assessable"]
    short: "A figure the engine refuses to invent because the information it needs does not exist yet, usually because no reviewer has recorded a decision."
    explanation: "Some of the most important measures, such as how often a flag turns out to be a real problem, need reviewers' decisions. Until reviewers record them, the engine says the figure cannot be measured instead of showing a number that looks like one."
    analogy: "Like a new restaurant with no reviews: the honest rating is 'no reviews yet', not a made-up four stars."
    in_this_app: "Shown in words wherever it applies, on the Validation report, the Pattern-finding models page and the Overview."
  identity_masking:
    term: "Hidden identities (masking)"
    also_called: ["masking", "pseudonym", "unmask"]
    short: "Patient and provider names and IDs are replaced by stand-in codes unless your role, or your assignment to the case, allows you to see them."
    explanation: "Most reviewers do not need to know who a patient is to judge whether a claim is payable, so identities are hidden by default. Roles that may see them can reveal an identity by giving a reason, and every reveal is written to the audit log."
    analogy: "Like a blind marking scheme for exam papers: the marker judges the answer, not the name on the front."
    in_this_app: "Case evidence and the Review queue show stand-in codes for claims reviewers; administrators, auditors and investigators on their own assigned cases see the real values."

data_help_pages:

  # ---------------------------------------------------------------------------
  # The shipped datasets (Data page chooser). Keyed by file or folder name.
  # ---------------------------------------------------------------------------
  shipped:
    uae_demo.zip:
      name: "UAE demo claims (multi-table)"
      synthetic: true
      default: true
      one_line: "Eighteen months of claims from UAE-style hospitals, clinics, pharmacies, labs and radiology centres, in AED, with the supporting tables most checks need (service lines, approvals, payments, providers, patients, prescriptions, documents)."
      use_when: "Start here. It lets most checks and both pattern-finding models run, so every page has something to show."
    uae_demo:
      name: "UAE demo claims (multi-table)"
      synthetic: true
      default: true
      one_line: "Eighteen months of claims from UAE-style hospitals, clinics, pharmacies, labs and radiology centres, in AED, with the supporting tables most checks need (service lines, approvals, payments, providers, patients, prescriptions, documents)."
      use_when: "Start here. It lets most checks and both pattern-finding models run, so every page has something to show."
    claims_demo_synthetic.csv:
      name: "Earlier demo claims (one row per claim)"
      synthetic: true
      default: false
      one_line: "20,893 generated claims over five years, one row per claim, amounts in Indian rupees converted to AED. Only the checks that need nothing beyond the claim summary can run on it."
      use_when: "Use it to see how much less the engine can do when a file has only claim summaries."
    claims.csv:
      name: "Sample claim extract (one row per claim)"
      synthetic: false
      default: false
      one_line: "A 5,000-claim sample in the same one-row-per-claim layout, amounts in Indian rupees converted to AED. The file the engine's tests were first built against."
      use_when: "Use it to compare results on a small file in the simple layout."

  # ---------------------------------------------------------------------------
  # File formats (adapters), for the picker. Keyed by adapter name.
  # ---------------------------------------------------------------------------
  adapters:
    uae_multitable:
      label: "UAE multi-table (a folder or .zip of several tables)"
      when: "Choose this for the UAE demo, or for any folder or .zip that holds separate tables for claims, service lines, providers, patients and so on."
    generic_india_tpa:
      label: "Generic claim list (one row per claim, .csv)"
      when: "Choose this for a single spreadsheet-style file with one row per claim, like the two older demo files."
    shafafiya:
      label: "Shafafiya layout (Abu Dhabi Department of Health), not yet certified"
      when: "Choose this for an export in the Shafafiya layout. It has been tested on samples, not on a live regulator feed."
    eclaimlink:
      label: "eClaimLink layout (Dubai Health Authority), not yet certified"
      when: "Choose this for an export in the eClaimLink layout. It has been tested on samples, not on a live regulator feed."

  # ---------------------------------------------------------------------------
  # The five promotion-gate conditions, as plain questions (gate.py names).
  # ---------------------------------------------------------------------------
  gate_questions:
    "Temporal holdout evaluation": "tested fairly, on later claims from providers it had never seen"
    "Prospective lift over ANL-01-R01": "finds more real issues than the simple scorecard"
    "Calibration check": "is right as often as it sounds sure"
    "Drift monitoring": "still sees claims like the ones it learned from"
    "Explanation quality": "can explain each flag in real units a reviewer can check"
    "Gate evaluation": "could be checked at all on this file"

  # ---------------------------------------------------------------------------
  # Report files (Validation Report downloads). Keyed by file name.
  # ---------------------------------------------------------------------------
  artefacts:
    validation_report.md: "The full validation report: what ran, what it found and what cannot be measured."
    release_gate_report.md: "The release checks: whether each requirement is built, tested and passing."
    model_card.md: "The pattern-finding models: how they were trained, tested and why they are not yet cleared for use."
    limitations.md: "Everything this run cannot show, stated plainly."
    control_coverage_matrix.csv: "All 164 checks and whether each could run on this file."
    traceability_matrix.csv: "Which part of the code and which test covers each requirement."
    metrics.csv: "Every measure the report uses, including the ones that cannot be measured yet."
    evaluation_protocol.csv: "How each measure is calculated and on what."
    precision_by_ground_truth_source.csv: "How often flags matched the labels in the file, by where each label came from (an upper bound, not a review result)."
    recall_by_fraud_type.csv: "How many of the labelled problems were flagged, by type (on labels, not on review results)."
    parameter_registry.csv: "Every setting and threshold, with its owner and reason."
    canonical_population_report.csv: "Which kinds of information the file supplied and which it did not."
    control_run_report.csv: "What each check did on this run."
    case_queue.csv: "Every case in the review queue."

  # ---------------------------------------------------------------------------
  # Measures that can be "not measurable yet" (fwa.evaluation.metrics names),
  # with the plain reason. Used by the Validation Report summary.
  # ---------------------------------------------------------------------------
  metrics:
    "Confirmed AED":
      label: "money confirmed by a reviewer"
      why: "no reviewer has recorded a decision yet"
    "Prevented / recovered AED":
      label: "money actually stopped or recovered"
      why: "no reviewer has recorded a decision, and nothing has been stopped or recovered"
    "Net savings after review cost":
      label: "savings after the cost of reviewing"
      why: "the cost of reviewing can be worked out, but the savings side needs confirmed recoveries, which do not exist yet"
    "Provider/member abrasion":
      label: "complaints and appeals caused by wrong flags"
      why: "no complaints or appeals about flagged claims have been recorded"
    "Pend turnaround":
      label: "how long held claims wait for a decision"
      why: "no reviewer has recorded a decision yet"
    "Overturn / appeal rate":
      label: "how often decisions are overturned on appeal"
      why: "no decision has been made or appealed yet"
    "Rule stability":
      label: "how often checks need changing after going live"
      why: "no check has been switched on for real use yet; all are watch-only"
    "Time to case disposition":
      label: "how long a case takes to decide"
      why: "no reviewer has recorded a decision yet"
    "Precision (confirmed ÷ reviewed)":
      label: "how often a flag turns out to be a real problem"
      why: "no reviewer has recorded a decision yet"

  # ---------------------------------------------------------------------------
  # What each role can do, in words (Help page). Keyed by role value.
  # ---------------------------------------------------------------------------
  role_can_do:
    ADMIN: "Manage users, roles and organisations; switch checks on for real use; switch a check off in an emergency or roll it back; read the audit log."
    POLICY_OWNER: "Write, edit and retire checks; set thresholds; approve a check for real use when someone else wrote it; sign off."
    CLAIMS_REVIEWER: "Record a decision with a reason; record an appeal; refer a case to the investigations team."
    CLINICAL_REVIEWER: "Record clinical decisions; write expert coding rules; confirm coding findings."
    SIU_INVESTIGATOR: "Investigate referred cases; link related cases; record the outcome of an investigation."
    ANALYST: "Load data and re-run the engine; recalibrate; propose a model for use (someone else must approve it)."
    QA: "Attach and confirm test evidence; record evidence for the release checks."
    AUDITOR: "Nothing that changes anything. Read everything and export evidence."
