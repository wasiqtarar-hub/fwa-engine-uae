controls:
- rule_id: NET-01-R01
  name: Referral concentration outlier
  version: 1.0.0
  status: shadow
  type: S
  stage: MODEL_MONTHLY
  population: agents with at least cfg.min_entity_opportunities claims
  inputs:
  - claim_header.agent_id
  - claim_header.provider_sk
  - claim_header.gross_amount_aed
  expression: top_recipient_share(agent) > cfg.referral_concentration_threshold and the agent's claim
    count is above the minimum denominator
  parameters:
    threshold: cfg.referral_concentration_threshold
  exclusions:
  - corporate_group_or_narrow_network
  - centre_of_excellence
  - small_denominator
  - inferred_edge_not_a_clinical_referral
  grouping_key:
  - tenant_id
  - payer_id
  - agent_id
  - scenario_id
  - period_bucket
  score: 58
  disposition: POSTPAY_AUDIT
  reason_code: REFERRAL_CONCENTRATION
  evidence_fields:
  - agent_id
  - top_provider_sk
  - top_provider_share
  - hhi
  - claim_count
  - distinct_providers
  - exposure_aed
  - edge_type
  owner: siu
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: 'There are no referral edges in the claim extract. The implemented edge is AGENT→PROVIDER
    co-occurrence: the share of an agent''s claims flowing to their single most-used provider, plus the
    Herfindahl index of that agent''s provider distribution. That is a distribution-channel concentration,
    not a clinical referral, and the signal says so. The peer comparison is by agent portfolio size, not
    by specialty or geography, because neither is available.'
  required_canonical_fields:
  - referral.referrer_id
  - referral.recipient_id
  - provider.specialty
  - provider.emirate
  - encounter.location
  implementation: net_01_r01_referral_concentration
  catalogue_trigger: Top-recipient share/HHI exceeds specialty/geographic peers
  catalogue_config_exclusions: Group/network and centre-of-excellence
  catalogue_disposition: Network case
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
