  - payer_id
  - agent_id
  - scenario_id
  - period_bucket
  score: 48
  disposition: POSTPAY_AUDIT
  reason_code: EARLY_TENURE_CLUSTER
  evidence_fields:
  - agent_id
  - early_tenure_high_value_count
  - agent_claim_count
  - agent_rate
  - overall_rate
  - shrunk_rate
  - posterior_interval
  - exposure_aed
  - never_individual_denial_notice
  owner: analytics
  effective_from: '2026-01-01'
  priority: P2
  data_support: PARTIAL
