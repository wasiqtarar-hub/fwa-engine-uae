- rule_id: NET-02-R02
  name: Dense member circulation
  version: 1.0.0
  status: shadow
  type: N
  stage: NETWORK_WEEKLY
  population: Louvain communities of at least cfg.community_min_size nodes
  inputs:
  - claim_header.member_sk
  - claim_header.provider_sk
  - claim_header.agent_id
  - claim_header.service_date
  - claim_header.gross_amount_aed
  expression: internal_edge_density(community) > cfg.community_density_threshold and community size >=
    cfg.community_min_size
  parameters:
    min_size: cfg.community_min_size
    density: cfg.community_density_threshold
  exclusions:
  - size_matched_peers_only
  - specialty_matching_unavailable
  - geography_matching_unavailable
  - corporate_group_structure
  grouping_key:
  - tenant_id
  - payer_id
  - community_id
  - scenario_id
  - period_bucket
  score: 55
  disposition: SIU_LEAD
  reason_code: DENSE_MEMBER_CIRCULATION
  evidence_fields:
  - community_id
  - size
  - internal_density
  - peer_density_median
  - member_count
  - provider_count
  - agent_count
  - claim_count
  - exposure_aed
  - snapshot_window
  - each_claim_counted_once
  owner: siu
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: Louvain communities are computed on the real member-provider-agent-TPA graph built
    from the claim extract, with weekly time-bounded snapshots, and internal density is compared against SIZE-matched
    communities. Peer matching on specialty and geography is not possible, so the comparison is size-only
    and the signal records that.
  required_canonical_fields:
  - provider.specialty
  - provider.emirate
  - encounter.location
  - provider.owner_entity_id
  - provider.bank_account_token
  - provider.phone_token
  - provider.address_token
  implementation: net_02_r02_dense_member_circulation
  catalogue_trigger: Community has abnormal internal member/provider edge density and low external flow
  catalogue_config_exclusions: Specialty/geography/size matched communities
  catalogue_disposition: SIU graph
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
- rule_id: NET-02-R03
  name: Synchronized billing
  version: 1.0.0
  status: shadow
  type: N/S
  stage: POSTPAY_DAILY
  population: communities identified by NET-02-R02's graph snapshot
  inputs:
  - claim_header.service_date
  - claim_header.gross_amount_aed
  - claim_header.provider_sk
  - claim_header.member_sk
  expression: two or more claims in one community share an admission date and have gross amounts within
    cfg.duplicate_amount_tolerance of each other
  parameters:
    amount_tolerance: cfg.duplicate_amount_tolerance
  exclusions:
  - batch_billing_system
  - code_signature_unavailable
  - resubmission_signature_unavailable
  - standard_package_pricing
  grouping_key:
  - tenant_id
  - payer_id
  - community_id
  - scenario_id
  - period_bucket
  score: 55
  disposition: MONITOR_ONLY
  reason_code: SYNCHRONIZED_BILLING
  evidence_fields:
  - community_id
  - synchronised_claims
  - shared_date
  - amount_spread
  - distinct_members
  - distinct_providers
  - limbs_available
  owner: analytics
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: 'The TIME and AMOUNT limbs run: claims within a community that share an admission
    date and a closely-matching amount are a synchronisation signature. The CODE and RESUBMISSION limbs
    do not (no codes, no lineage). The catalogue already assigns this control ''supporting evidence''
    status and MONITOR_ONLY, which is retained.'
  required_canonical_fields:
  - claim_line.activity_code
  - claim_line.units
  - claim_line.net_amount
  - claim_version.relationship
  - claim_version.prior_claim_sk
  - claim_version.changed_fields
  implementation: net_02_r03_synchronized_billing
  catalogue_trigger: Community claims share unusual time, amount, code or resubmission signatures
  catalogue_config_exclusions: Batch billing systems
  catalogue_disposition: Supporting evidence
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
