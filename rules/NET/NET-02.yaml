  - tenant_id
  - payer_id
  - community_id
  - scenario_id
  - period_bucket
  score: 82
  disposition: MONITOR_ONLY
  reason_code: SHARED_ADMIN_IDENTITY
  evidence_fields:
  - rule_id
  - scenario_id
  - subject_id
  - reason_code
  owner: siu
  effective_from: '2026-01-01'
  priority: P1
  data_support: NOT_EXECUTABLE_ON_THIS_DATASET
  data_support_reason: No bank, phone, address, device or owner identifiers exist. The entity-resolution
