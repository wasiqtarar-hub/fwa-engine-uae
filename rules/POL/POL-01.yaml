- rule_id: POL-01-R04
  name: Early-tenure utilization anomaly
  version: 1.0.0
  status: shadow
  type: S
  stage: MODEL_MONTHLY
  population: claims within cfg.early_tenure_days of policy inception
  inputs:
  - claim_header.days_since_policy_start
  - claim_header.gross_amount_aed
  - diagnosis.code
  - claim_header.previous_fraud_on_policy
  expression: days_since_policy_start < cfg.early_tenure_days and robust_residual(gross_amount_aed, diagnosis_peer_group)
    > cfg.robust_residual_flag_threshold
  parameters:
    early_tenure_days: cfg.early_tenure_days
    threshold: cfg.robust_residual_flag_threshold
  exclusions:
  - maternity_continuity
  - chronic_condition_continuity
  - guaranteed_issue_product
  - not_evidence_of_fraud_alone
  - morbidity_model_unavailable
  grouping_key:
  - tenant_id
  - payer_id
  - member_sk
  - scenario_id
  - period_bucket
  score: 58
  disposition: MONITOR_ONLY
  reason_code: EARLY_TENURE_UTILISATION
  evidence_fields:
  - member_sk
  - days_since_policy_start
  - early_tenure_days
  - gross_amount_aed
  - peer_median_aed
  - robust_residual
  - diagnosis_code
  - previous_fraud_on_policy
  - peer_level_used
  - not_fraud_evidence_alone_notice
  owner: underwriting
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: days_since_policy_start supports the tenure limb exactly, and claim value supports
    the utilisation limb. Risk adjustment is by primary diagnosis, not by a morbidity model. previous_fraud_on_policy
    is used as a POLICY-HISTORY input (it is a policy attribute in the source, not the held-out outcome
    label) and is reported separately in the evidence so a reviewer can weigh it themselves. The catalogue's
    caution — 'not evidence of fraud alone' — is reproduced on the signal and the disposition is MONITOR_ONLY.
  required_canonical_fields:
  - morbidity_model.*
  - policy_event.*
  implementation: pol_01_r04_early_tenure_utilisation
  catalogue_trigger: Claim pattern shortly after inception exceeds tenure/risk-adjusted expectation
  catalogue_config_exclusions: Not evidence of fraud alone; maternity/chronic continuity
  catalogue_disposition: Monitor/distribution signal
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
