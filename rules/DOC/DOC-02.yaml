  - similarity
  - threshold
  - member_sks
  - provider_sk
  - boilerplate_removed
  - synthetic_document_marker
  owner: clinical_policy
  effective_from: '2026-01-01'
  priority: P2
  data_support: PARTIAL
  data_support_reason: Runs against the SYNTHETIC corpus only. Boilerplate is stripped before comparison,
    as the catalogue requires, and similarity is computed on the patient-specific remainder. Because the
    corpus is generated from templates, a baseline similarity is expected and the threshold (cfg.doc_clone_similarity_threshold)
    is set above it — a limitation stated on every signal.
