  name: Cross-patient near duplicate
  version: 1.0.0
  status: shadow
  type: T
  stage: POSTPAY_DAILY
  population: pairs of synthetic documents belonging to different members
  inputs:
  - document.text
  - claim_header.member_sk
  - claim_header.provider_sk
  expression: token-set similarity of the boilerplate-stripped text between two documents for DIFFERENT
    members exceeds cfg.doc_clone_similarity_threshold
