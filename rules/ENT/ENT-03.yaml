- rule_id: ENT-03-R02
  name: Excluded/watch-listed entity
  version: 1.0.0
  status: shadow
  type: H
  stage: PREPAY_SYNC
  population: claim where provider_blacklist_flag is true
  inputs:
  - claim_header.provider_sk
  - provider_status_period.status_value
  - provider_status_period.valid_from
  - provider_status_period.valid_to
  expression: provider_status_period.status_value == 'BLACKLISTED' as_of claim.service_date and match_type
    == 'EXACT'
  parameters:
    requires_exact_match: cfg.blacklist_requires_exact_match
  exclusions:
  - fuzzy_match_pends_only
  - approved_internal_exception
  - delisted_before_service_date
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 90
  disposition: PREPAY_PEND
  reason_code: EXCLUDED_ENTITY
  evidence_fields:
  - provider_sk
  - status_value
  - match_type
  - exclusion_source
  - effective_dating_available
  owner: provider_network
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: provider_blacklist_flag is the only exclusion-list signal available and it is UNDATED,
    so 'effective match at service time' cannot be evaluated. The catalogue permits REJECT only on an
    exact, effective-dated identifier match; with no effective date the governed disposition is downgraded
    to PREPAY_PEND, which is the treatment the catalogue itself prescribes for a non-exact match.
  required_canonical_fields:
  - provider_status_period.status_type
  - provider_status_period.valid_from
  - provider_status_period.valid_to
  - provider.regulator_id
  - provider_status_period.valid_from (effective dating for the exclusion)
  implementation: ent_03_r02_excluded_entity
  catalogue_trigger: Effective match on regulator or approved internal exclusion list
  catalogue_config_exclusions: Exact ID match required for reject; fuzzy match only pends
  catalogue_disposition: Reject or SIU lead
  alternate_dispositions:
  - SIU_LEAD
  governance_note: Disposition downgraded from REJECT to PREPAY_PEND because the exclusion source carries
    no effective date. Recorded rather than silently applied.
  shadow_since: '2026-01-01'
