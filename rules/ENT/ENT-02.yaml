- rule_id: ENT-02-R03
  name: Member impossible presence
  version: 1.0.0
  status: shadow
  type: S
  stage: PREPAY_ASYNC
  population: claim pairs where member_sk is equal and the encounters overlap in time
  inputs:
  - encounter.admission_date
  - encounter.discharge_date
  - claim_header.member_sk
  - claim_header.provider_sk
  expression: overlaps(a.admission_date, a.discharge_date, b.admission_date, b.discharge_date, tolerance_days=cfg.concurrent_admission_overlap_tolerance_days)
    is TRUE and a.provider_sk != b.provider_sk
  parameters:
    tolerance_days: cfg.concurrent_admission_overlap_tolerance_days
    max_concurrent: cfg.max_concurrent_admissions_per_member
  exclusions:
  - inpatient_ancillary_lines
  - telehealth_encounter
  - claim_date_without_time
  - same_provider_transfer_within_facility
  grouping_key:
  - tenant_id
  - payer_id
  - member_sk
  - scenario_id
  - period_bucket
  score: 62
  disposition: PREPAY_PEND
  reason_code: MEMBER_IMPOSSIBLE_PRESENCE
  evidence_fields:
  - member_sk
  - overlapping_claims
  - admission_dates
  - discharge_dates
  - overlap_days
  - providers
  owner: claims_policy
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: 'The OVERLAPPING-ENCOUNTER limb runs: admission and discharge dates exist, so two
    inpatient stays for one member that overlap in time are detectable. The TRAVEL-SPEED limb does not
    run — there is no geography. Dates carry no time component, so a same-day transfer cannot be distinguished
    from a genuine overlap and confidence is reduced accordingly.'
  required_canonical_fields:
  - provider.emirate
  - encounter.location
  - encounter.start_time (with time of day)
  implementation: ent_02_r03_member_impossible_presence
  catalogue_trigger: Same member has overlapping encounters or travel speed above cfg.max_speed
  catalogue_config_exclusions: Inpatient ancillary lines, telehealth, claim date without time
  catalogue_disposition: Member lead with encounter pairs
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
