- rule_id: PHR-03-R03
  name: Provider/pharmacy volume spike
  version: 1.0.0
  status: shadow
  type: S
  stage: MODEL_MONTHLY
  population: claims with a non-null pharmacy_bill_ratio and a resolvable diagnosis peer group
  inputs:
  - claim_header.pharmacy_bill_ratio
  - diagnosis.code
  - claim_header.provider_sk
  - claim_header.gross_amount_aed
  expression: pharmacy_bill_ratio > cfg.pharmacy_share_peer_multiple * diagnosis_peer_median(pharmacy_bill_ratio)
  parameters:
    multiple: cfg.pharmacy_share_peer_multiple
  exclusions:
  - new_formulary_status
  - centre_of_excellence_status
  - patient_mix_shift
  - insufficient_peer_evidence
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 58
  disposition: POSTPAY_AUDIT
  reason_code: PHARMACY_VOLUME_SPIKE
  evidence_fields:
  - pharmacy_bill_ratio
  - peer_median_ratio
  - peer_multiple
  - implied_pharmacy_aed
  - diagnosis_code
  - peer_level_used
  - peer_n
  owner: pharmacy_policy
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: Implemented on the pharmacy SHARE residual against diagnosis peers — the only pharmacy
    quantity in the source — rather than on drug volume or value. A provider whose pharmacy share sits
    above cfg.pharmacy_share_peer_multiple × the diagnosis-peer median is flagged. 'Without patient-mix
    shift' is partially controlled by the diagnosis-level peer group, not by a formal mix adjustment.
  required_canonical_fields:
  - prescription_dispense.billed_product
  - prescription_dispense.days_supply
  - prescription_dispense.prescriber_id
  - prescription_dispense.pharmacy_id
  - claim_line.activity_code (drug-level volume and value)
  implementation: phr_03_r03_pharmacy_volume_spike
  catalogue_trigger: Risk-adjusted volume/value changepoint without patient-mix shift
  catalogue_config_exclusions: New formulary/centre status
  catalogue_disposition: Audit
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
