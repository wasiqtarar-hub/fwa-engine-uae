- rule_id: CLN-06-R02
  name: Closed/non-operational facility service
  version: 1.0.0
  status: shadow
  type: H/S
  stage: POSTPAY_DAILY
  population: providers flagged on the exclusion list or with a thin, concentrated footprint
  inputs:
  - claim_header.provider_sk
  - provider_status_period.status_value
  - claim_header.service_date
  - claim_header.gross_amount_aed
  expression: provider is exclusion-listed OR (provider claim count is low AND claims concentrate into
    few days AND mean claim value exceeds the peer median)
  parameters: {}
  exclusions:
  - 24_hour_or_emergency_service
  - outreach_service
  - new_provider_onboarding
  - operating_period_unverifiable
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 90
  disposition: SIU_LEAD
  reason_code: NON_OPERATIONAL_FACILITY
  evidence_fields:
  - provider_sk
  - exclusion_listed
  - claim_count
  - active_days
  - claims_per_active_day
  - mean_gross_aed
  - peer_median_gross_aed
  - limb_fired
  owner: siu
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: The 'verified operating period' limb cannot run (no operating periods). The 'no
    credible operating footprint' limb is implemented as a composite of the undated blacklist flag plus
    a thin, bursty claim footprint, and the signal states which limb fired. SIU_LEAD is the catalogue
    disposition and is retained — this control never denies.
  required_canonical_fields:
  - provider_status_period.valid_from/valid_to (operating periods)
  - provider.facility_type
  implementation: cln_06_r02_non_operational_facility
  catalogue_trigger: Service occurs outside verified operating period or facility shows no credible operating
    footprint
  catalogue_config_exclusions: 24-hour/emergency and outreach service
  catalogue_disposition: SIU lead
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
- rule_id: CLN-06-R03
  name: Repeated synthetic encounter signature
  version: 1.0.0
  status: shadow
  type: S
  stage: POSTPAY_DAILY
  population: providers with at least cfg.min_entity_opportunities claims
  inputs:
  - claim_header.provider_sk
  - claim_header.member_sk
  - diagnosis.code
  - encounter.length_of_stay_days
  - claim_header.gross_amount
  expression: a (diagnosis, length_of_stay, gross_amount) triple recurs across two or more DISTINCT members
    at the same provider
  parameters: {}
  exclusions:
  - standard_package_pricing
  - batch_timestamp_artefact
  - capitated_arrangement
  - single_member_repeat
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 62
  disposition: POSTPAY_AUDIT
  reason_code: SYNTHETIC_ENCOUNTER_SIGNATURE
  evidence_fields:
  - provider_sk
  - signature
  - distinct_members
  - claim_sks
  - repeat_count
  - gross_amount_aed
  owner: analytics
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: 'Implemented on the signature available: identical (primary diagnosis, length of
    stay, requested amount) triples recurring across DIFFERENT members at one provider. Codes and notes
    are unavailable, so the signature is coarser than the catalogue''s and can be produced by a genuine
    standard package — which is why ''standard_package'' is a declared exclusion and the disposition is
    an audit, not a denial.'
  required_canonical_fields:
  - claim_line.activity_code
  - claim_line.units
  - claim_line.net_amount
  - observation.attachment_ref
  - document.text
  - document.language
  implementation: cln_06_r03_synthetic_encounter_signature
  catalogue_trigger: High rate of identical code/time/amount/note patterns across unrelated members
  catalogue_config_exclusions: Standard packages and batch timestamps
  catalogue_disposition: Provider case
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
