# =============================================================================
# CLN-04: Unnecessary, excessive or repeated services · P0
# =============================================================================
# Scenario transcribed from the control catalogue. Every control below carries
# the catalogue's verbatim trigger, configuration/exclusions and
# output/disposition alongside this artefact's governed mapping.
#
# GENERATED FILE — regenerate with `python tools/gen_rules.py`. Hand edits are a
# legitimate policy-owner workflow but must be carried back into
# tools/catalogue_source.py or they will be overwritten.
#
# `disposition` is ONE of the eight governed dispositions. Where the catalogue
# names several ("Reject/pend"), the first is taken and the rest are recorded
# as `alternate_dispositions`, which are ADVISORY ONLY — the engine never acts
# on them. Where the first would be illegal under the safety boundary for the
# control's type, the substitution is recorded in `governance_note`.
#
# `exclusions` for controls that do not execute here are derived mechanically
# from the catalogue's "Configuration and exclusions" column; for the controls
# this build actually runs they are hand-authored and are exercised by the
# approved-exception test category.
#
# Every control starts in `shadow`. Nothing in this catalogue is active until a
# policy owner who did not author it approves the transition.
# =============================================================================
scenario:
  scenario_id: CLN-04
  title: Unnecessary, excessive or repeated services
  priority: P0
  added_by_coverage_audit: false
  control_count: 5
  source: Control catalogue v3.0, transcribed in full.
controls:
- rule_id: CLN-04-R01
  name: Minimum repeat interval
  version: 1.0.0
  status: shadow
  type: E
  stage: PREPAY_SYNC
  population: claim pairs for the same member with the same principal diagnosis
  inputs:
  - claim_header.member_sk
  - diagnosis.code
  - encounter.admission_date
  expression: a prior claim exists for the same member and principal diagnosis with 0 <= days_between
    <= cfg.min_repeat_interval_days and no accepted indicator
  parameters:
    interval_days: cfg.min_repeat_interval_days
  exclusions:
  - accepted_clinical_indicator
  - code_family_permits_repeat
  - required_observation_present
  - planned_staged_care
  - chemotherapy_or_dialysis_pathway
  grouping_key:
  - tenant_id
  - payer_id
  - member_sk
  - episode_id
  - scenario_id
  score: 78
  disposition: PREPAY_PEND
  reason_code: MINIMUM_REPEAT_INTERVAL
  evidence_fields:
  - prior_claim_sk
  - days_between
  - diagnosis_code
  - provider_sk
  - prior_provider_sk
  - interval_threshold
  owner: clinical_policy
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: '''Same or equivalent service'' is approximated by the same primary diagnosis for
    the same member, because there are no service codes. The interval test itself runs exactly as specified
    against cfg.min_repeat_interval_days.'
  required_canonical_fields:
  - claim_line.activity_code
  - claim_line.units
  - claim_line.net_amount
  - observation.*
  - repeat_interval_policy.*
  implementation: cln_04_r01_minimum_repeat_interval
  catalogue_trigger: Same/equivalent service repeated inside policy interval without accepted indicator
  catalogue_config_exclusions: Code family, clinical exception and required Observation
  catalogue_disposition: Clinical pend
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
- rule_id: CLN-04-R02
  name: Episode frequency excess
  version: 1.0.0
  status: shadow
  type: E/S
  stage: POSTPAY_DAILY
  population: member with at least one claim in the utilisation window
  inputs:
  - claim_header.member_sk
  - encounter.admission_date
  expression: count(member claims strictly earlier within cfg.utilisation_velocity_window_days) >= cfg.member_repeat_service_threshold
  parameters:
    threshold: cfg.member_repeat_service_threshold
    window_days: cfg.utilisation_velocity_window_days
  exclusions:
  - chronic_care_pathway
  - oncology_or_dialysis_pathway
  - age_risk_adjustment_unavailable
  - maternity_pathway
  grouping_key:
  - tenant_id
  - payer_id
  - member_sk
  - scenario_id
  - period_bucket
  score: 78
  disposition: PREPAY_PEND
  reason_code: EPISODE_FREQUENCY_EXCESS
  evidence_fields:
  - member_sk
  - claims_in_window
  - window_days
  - threshold
  - diagnoses_in_window
  - providers_in_window
  - total_gross_aed
  owner: clinical_policy
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: Member-level admission counts within the utilisation window are computable and
    are compared against cfg.member_repeat_service_threshold. Risk adjustment for age is not possible
    (no demographics), so the peer comparison is diagnosis-based only.
  required_canonical_fields:
  - claim_line.activity_code
  - claim_line.units
  - claim_line.net_amount
  - member.date_of_birth
  - member.sex
  - care_pathway_policy.*
  implementation: cln_04_r02_episode_frequency_excess
  catalogue_trigger: Count per episode/member exceeds policy maximum or risk-adjusted peer threshold
  catalogue_config_exclusions: Diagnosis/care pathway and age
  catalogue_disposition: Pend/audit
  alternate_dispositions:
  - POSTPAY_AUDIT
  governance_note: ''
  shadow_since: '2026-01-01'
