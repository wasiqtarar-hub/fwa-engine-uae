- rule_id: CLN-04-R04
  name: Provider utilization outlier
  version: 1.0.0
  status: shadow
  type: S
  stage: MODEL_MONTHLY
  population: provider with at least cfg.min_entity_opportunities claims
  inputs:
  - claim_header.provider_sk
  - claim_header.member_sk
  expression: shrunk claims-per-member for the provider exceeds the peer posterior upper bound and posterior_interval_width
    <= cfg.max_posterior_width
  parameters:
    max_posterior_width: cfg.max_posterior_width
  exclusions:
  - case_mix_difference
  - referral_centre_role
  - small_denominator
  - posterior_interval_too_wide
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 62
  disposition: POSTPAY_AUDIT
  reason_code: PROVIDER_UTILISATION_OUTLIER
  evidence_fields:
  - provider_sk
  - claims_per_member
  - shrunk_value
  - posterior_interval
  - peer_mean
  - peer_level_used
  - peer_n
  - distinct_members
  owner: analytics
  effective_from: '2026-01-01'
  priority: P0
  data_support: PARTIAL
  data_support_reason: Claims per distinct member at a provider is computable and is shrunk toward the
    peer mean. 'Services' is substituted by 'claims' because there are no service lines, so the intensity
    of each claim is invisible to this control.
  required_canonical_fields:
  - claim_line.activity_code
  - claim_line.units
  - claim_line.net_amount
  - referral.*
  implementation: cln_04_r04_provider_utilisation_outlier
  catalogue_trigger: Services per comparable episode/member exceed shrunk peers
  catalogue_config_exclusions: Case mix, referral role and denominator
  catalogue_disposition: Provider case
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
