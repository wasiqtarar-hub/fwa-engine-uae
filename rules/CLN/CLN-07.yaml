- rule_id: CLN-07-R02
  name: Facility/staff capacity
  version: 1.0.0
  status: shadow
  type: E/S
  stage: POSTPAY_DAILY
  population: provider-days with at least one active inpatient stay
  inputs:
  - claim_header.provider_sk
  - encounter.admission_date
  - encounter.discharge_date
  expression: concurrent_occupancy(provider, day) > cfg.provider_daily_capacity_admissions * cfg.capacity_tolerance_multiple
  parameters:
    capacity: cfg.provider_daily_capacity_admissions
    tolerance: cfg.capacity_tolerance_multiple
  exclusions:
  - roster_unavailable_low_confidence
  - licensed_capacity_not_sourced
  - outreach_or_mobile_service
  - day_case_turnover
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 70
  disposition: POSTPAY_AUDIT
  reason_code: FACILITY_CAPACITY_EXCEEDED
  evidence_fields:
  - provider_sk
  - peak_day
  - peak_concurrent_occupancy
  - assumed_capacity
  - tolerance_multiple
  - claims_on_peak_day
  - capacity_source
  owner: provider_network
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: Concurrent inpatient occupancy per provider per day is computable from admission
    and discharge dates and is compared against cfg.provider_daily_capacity_admissions × cfg.capacity_tolerance_multiple.
    The capacity figure is a CONFIGURED PLACEHOLDER, not a licensed bed count — the catalogue's own note
    that 'missing roster produces low confidence' applies directly, and the signal's confidence is reduced
    accordingly.
  required_canonical_fields:
  - provider.licensed_bed_count
  - provider.room_count
  - clinician_roster.*
  implementation: cln_07_r02_facility_capacity
  catalogue_trigger: Claimed volume exceeds rooms/equipment/licensed staff capacity plus tolerance
  catalogue_config_exclusions: Missing roster produces low confidence
  catalogue_disposition: Audit lead
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
