- rule_id: CLN-07-R04
  name: Capacity trend discontinuity
  version: 1.0.0
  status: shadow
  type: S
  stage: MODEL_MONTHLY
  population: providers with at least cfg.min_history_periods monthly periods
  inputs:
  - claim_header.provider_sk
  - claim_header.service_date
  expression: CUSUM on monthly claim throughput crosses cfg.cusum_h after at least cfg.min_history_periods
    periods of history
  parameters:
    k: cfg.cusum_k
    h: cfg.cusum_h
    min_history: cfg.min_history_periods
  exclusions:
  - staff_or_hours_change_unknown
  - facility_change_unknown
  - onboarding_or_data_feed_change
  - insufficient_history
  grouping_key:
  - tenant_id
  - payer_id
  - provider_sk
  - scenario_id
  - period_bucket
  score: 58
  disposition: POSTPAY_AUDIT
  reason_code: CAPACITY_TREND_DISCONTINUITY
  evidence_fields:
  - provider_sk
  - change_date
  - pre_change_mean
  - post_change_mean
  - cusum_statistic
  - periods_of_history
  - segmentation_caveat
  owner: analytics
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: 'Monthly claim throughput per provider is computable, and a CUSUM change point
    on it is exactly the shape of this control. What cannot be done is the EXCLUSION: without staff, hours
    or facility-change records there is no way to segment a legitimate expansion from a suspicious jump,
    so every signal carries that caveat and the disposition stays an audit.'
  required_canonical_fields:
  - clinician_roster.*
  - provider.operating_hours
  - contract.effective_dates
  implementation: cln_07_r04_capacity_trend_discontinuity
  catalogue_trigger: Throughput jumps without staff, hours, equipment or facility change
  catalogue_config_exclusions: Onboarding/data-feed changes
  catalogue_disposition: Provider case
  alternate_dispositions: []
  governance_note: ''
  shadow_since: '2026-01-01'
