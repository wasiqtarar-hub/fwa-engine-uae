controls:
- rule_id: PAY-10-R01
  name: Other coverage not coordinated
  version: 1.0.0
  status: shadow
  type: H
  stage: PREPAY_SYNC
  population: claim where num_insurers_same_event >= cfg.cob_min_insurers
  inputs:
  - claim_header.num_insurers_same_event
  - claim_header.gross_amount_aed
  - coverage_period.*
  expression: num_insurers_same_event >= cfg.cob_min_insurers and no coordination record exists
  parameters:
    min_insurers: cfg.cob_min_insurers
  exclusions:
  - uae_product_cob_policy_permits
  - lawful_top_up_cover
  - coordination_already_evidenced
  grouping_key:
  - tenant_id
  - payer_id
  - member_sk
  - episode_id
  - scenario_id
  score: 82
  disposition: PREPAY_PEND
  reason_code: COB_NOT_COORDINATED
  evidence_fields:
  - num_insurers_same_event
  - gross_amount_aed
  - member_sk
  - coordination_record_present
  - payer_order_evaluable
  owner: claims_policy
  effective_from: '2026-01-01'
  priority: P1
  data_support: PARTIAL
  data_support_reason: 'num_insurers_same_event > 1 establishes that other coverage EXISTS, which is the
    precondition the control needs, but payer ORDER cannot be evaluated: there is no primary/secondary
    designation and no other-payer payment record. The signal is therefore raised as ''coordination evidence
    required'', not as a wrong-order finding, and its confidence reflects that.'
  required_canonical_fields:
  - coverage_period.payer_order
  - other_payer_remittance.*
  implementation: pay_10_r01_cob_not_coordinated
  catalogue_trigger: Active primary/other coverage exists but claim submitted with wrong payer order
  catalogue_config_exclusions: UAE/product COB policy
  catalogue_disposition: Pend/reprice
  alternate_dispositions:
